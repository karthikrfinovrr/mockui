threshold.' },\n      { t:'{E} confirms divestment of minority stake', s:'Reuters', d:'28 Jun 2026', x:'Company reports completion of a sale and screening of remaining counterparties.' }\n    ] },\n  { title:'Corruption claims in public procurement tender', category:'Corruption', risk:'Medium',\n    articles:[\n      { t:'Tender award to {E} questioned by audit office', s:'National Audit Review', d:'14 May 2026', x:'Audit finds procedural irregularities in scoring; no finding of payment to officials.' },\n      { t:'Prosecutors decline to open case involving {E}', s:'Local Press', d:'30 May 2026', x:'Statement notes insufficient evidence to proceed; audit recommendations remain open.' }\n    ] }\n];\n\nfunction initials(name) { return String(name).split(/\\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase(); }\nfunction userById(id) { const u = USERS.find(x => x.id === id); return u || null; }\nfunction nameOf(id) { const u = userById(id); return u ? u.name : 'Unassigned'; }\n\nfunction storiesFor(id, entityName) {\n  const n = 2 + (id.charCodeAt(id.length - 1) % 3); // 2-4 stories\n  return STORY_SEEDS.slice(0, n).map((s, i) => ({\n    key: id + '-S' + (i + 1),\n    title: s.title,\n    category: s.category,\n    risk: s.risk,\n    articles: s.articles.map((a, j) => ({\n      key: id + '-S' + (i + 1) + '-A' + (j + 1),\n      title: a.t.split('{E}').join(entityName),\n      source: a.s, date: a.d, snippet: a.x\n    }))\n  }));\n}\n\nfunction mkCase(o) {\n  const stories = storiesFor(o.id, o.entityName);\n  const articleCount = stories.reduce((n, s) => n + s.articles.length, 0);\n  return Object.assign({\n    entityType:'ORGANISATION', categories:[], assignedL1Reviewer:null, assignedL2Reviewer:null,\n    l2ReviewRequired:false, l1ReviewStatus:'NOT_STARTED', l2ReviewStatus:'NOT_REQUIRED',\n    createdAt:'2026-09-10', updatedAt:'2026-09-15', decisions:[]\n  }, o, { stories: stories, storyCount: stories.length, articleCount: articleCount });\n}\n\nconst SEED_CASES = [\n  mkCase({ id:'CASE-00118', entityName:'Halston Pacific Holdings', riskLevel:'High', status:'AWAITING_SIGN_OFF',\n    categories:['Financial Crime','Regulatory'], assignedL1Reviewer:'USR-001', l2ReviewRequired:false,\n    l1ReviewStatus:'COMPLETED', l2ReviewStatus:'NOT_REQUIRED', createdAt:'2026-09-08', updatedAt:'2026-09-15',\n    decisions:[{ stage:'L1 Review', decision:'Confirm risk', reason:'Adverse media substantiated', comment:'Regulatory penalty confirmed by primary sources. No secondary review required under policy.', reviewer:'Joel Mensah', date:'15 Sep 2026 14:02' }] }),\n  mkCase({ id:'CASE-00121', entityName:'Meridian Trust Bank', riskLevel:'Critical', status:'L2_REVIEW',\n    categories:['Financial Crime','Fraud','Sanctions'], assignedL1Reviewer:'USR-001', assignedL2Reviewer:'USR-002',\n    l2ReviewRequired:true, l1ReviewStatus:'COMPLETED', l2ReviewStatus:'PENDING', createdAt:'2026-09-07', updatedAt:'2026-09-15',\n    decisions:[{ stage:'L1 Review', decision:'Escalate', reason:'Critical risk indicators', comment:'Sanctions exposure requires secondary review before outcome.', reviewer:'Joel Mensah', date:'15 Sep 2026 11:20' }] }),\n  mkCase({ id:'CASE-00124', entityName:'Northbank Group PLC', riskLevel:'High', status:'L1_REVIEW',\n    categories:['Financial Crime','Regulatory','Fraud'], assignedL1Reviewer:'USR-001', assignedL2Reviewer:'USR-002',\n    l2ReviewRequired:true, l1ReviewStatus:'IN_PROGRESS', l2ReviewStatus:'NOT_STARTED', createdAt:'2026-09-12', updatedAt:'2026-09-15' }),\n  mkCase({ id:'CASE-00127', entityName:'Elena Marchetti', entityType:'PERSON', riskLevel:'Medium', status:'L1_REVIEW',\n    categories:['Corruption'], assignedL1Reviewer:'USR-001', l2ReviewRequired:false,\n    l1ReviewStatus:'NOT_STARTED', l2ReviewStatus:'NOT_REQUIRED', createdAt:'2026-09-13', updatedAt:'2026-09-14' }),\n  mkCase({ id:'CASE-00129', entityName:'Corvallis Metals Group', riskLevel:'Medium', status:'PROCESSING',\n    categories:['Corporate Misconduct'], l2ReviewRequired:false, createdAt:'2026-09-15', updatedAt:'2026-09-15' }),\n  mkCase({ id:'CASE-00131', entityName:'Sable Ridge Capital', riskLevel:'High', status:'L2_REVIEW',\n    categories:['Fraud','Regulatory'], assignedL1Reviewer:'USR-004', assignedL2Reviewer:'USR-002',\n    l2ReviewRequired:true, l1ReviewStatus:'COMPLETED', l2ReviewStatus:'PENDING', createdAt:'2026-09-06', updatedAt:'2026-09-14',\n    decisions:[{ stage:'L1 Review', decision:'Escalate', reason:'Conflicting source reliability', comment:'Two stories need a second opinion on materiality.', reviewer:'Daniel Osei', date:'14 Sep 2026 16:40' }] }),\n  mkCase({ id:'CASE-00133', entityName:'Tobias Renner', entityType:'PERSON', riskLevel:'Low', status:'COMPLETED',\n    categories:['Regulatory'], assignedL1Reviewer:'USR-001', l2ReviewRequired:false,\n    l1ReviewStatus:'COMPLETED', l2ReviewStatus:'NOT_REQUIRED', createdAt:'2026-09-02', updatedAt:'2026-09-11',\n    decisions:[{ stage:'L1 Review', decision:'Close — no action', reason:'False positive', comment:'Name match only; subject is a different individual.', reviewer:'Joel Mensah', date:'11 Sep 2026 09:15' }] }),\n  mkCase({ id:'CASE-00135', entityName:'Avenir Logistique SA', riskLevel:'Medium', status:'NEW',\n    categories:['Corporate Misconduct','Fraud'], l2ReviewRequired:true, l2ReviewStatus:'NOT_STARTED',\n    createdAt:'2026-09-15', updatedAt:'2026-09-15' }),\n  mkCase({ id:'CASE-00136', entityName:'Kestrel Mining Ltd', riskLevel:'Critical', status:'L1_REVIEW',\n    categories:['Corruption','Sanctions'], assignedL1Reviewer:'USR-004', assignedL2Reviewer:'USR-005',\n    l2ReviewRequired:true, l1ReviewStatus:'IN_PROGRESS', l2ReviewStatus:'NOT_STARTED', createdAt:'2026-09-11', updatedAt:'2026-09-14' }),\n  mkCase({ id:'CASE-00138', entityName:'Ivar Lindqvist', entityType:'PERSON', riskLevel:'Medium', status:'L2_REVIEW',\n    categories:['Financial Crime'], assignedL1Reviewer:'USR-004', assignedL2Reviewer:'USR-005',\n    l2ReviewRequired:true, l1ReviewStatus:'COMPLETED', l2ReviewStatus:'PENDING', createdAt:'2026-09-05', updatedAt:'2026-09-13' })\n];\n\nconst L1_SPREAD = ['RELEVANT','RELEVANT','NOT_RELEVANT','RELEVANT','NOT_RELEVANT','RELEVANT','NOT_RELEVANT','RELEVANT','RELEVANT','NOT_RELEVANT','RELEVANT','NOT_RELEVANT'];\n\nfunction seedL1Buckets(cases) {\n  const map = {};\n  cases.forEach(c => {\n    if (c.l1ReviewStatus !== 'COMPLETED') return;\n    const local = {};\n    let i = 0;\n    c.stories.forEach(st => st.articles.forEach(a => {\n      const v = L1_SPREAD[i % L1_SPREAD.length];\n      i++; local[a.key] = v; map[a.key] = v;\n    }));\n    c.l1Buckets = local;\n  });\n  return map;\n}\n\nconst SEED_ACTIVITY = [\n  { text:'L1 review completed', meta:'Joel Mensah · CASE-00118', date:'15 Sep 2026 14:02', kind:'l1', caseId:'CASE-00118' },\n  { text:'32 articles reviewed', meta:'Joel Mensah · CASE-00124', date:'15 Sep 2026 13:48', kind:'info', caseId:'CASE-00124' },\n  { text:'Investigation opened', meta:'Joel Mensah · CASE-00124', date:'15 Sep 2026 13:31', kind:'info', caseId:'CASE-00124' },\n  { text:'L1 review completed · escalated to L2', meta:'Joel Mensah · CASE-00121', date:'15 Sep 2026 11:20', kind:'l1', caseId:'CASE-00121' },\n  { text:'Processing completed', meta:'System · CASE-00129', date:'15 Sep 2026 09:05', kind:'info', caseId:'CASE-00129' },\n  { text:'L1 review completed · escalated to L2', meta:'Daniel Osei · CASE-00131', date:'14 Sep 2026 16:40', kind:'l1', caseId:'CASE-00131' }\n];\n\nconst AUTO_SPREAD = ['RELEVANT','MANUAL_REVIEW','NOT_RELEVANT','RELEVANT','RELEVANT','NOT_RELEVANT','MANUAL_REVIEW','RELEVANT','NOT_RELEVANT','RELEVANT','MANUAL_REVIEW','RELEVANT'];\n\nfunction autoBuckets(cases) {\n  const map = {};\n  cases.forEach(c => {\n    let i = 0;\n    c.stories.forEach(st => st.articles.forEach(a => { map[a.key] = AUTO_SPREAD[i % AUTO_SPREAD.length]; i++; }));\n  });\n  return map;\n}\n\nfunction seedConfirmed(cases) {\n  const map = {};\n  cases.forEach(c => {\n    if (c.l1ReviewStatus !== 'COMPLETED') return;\n    c.stories.forEach(st => st.articles.forEach(a => { map[a.key] = true; }));\n  });\n  return map;\n}\n\nconst SEED_L1 = seedL1Buckets(SEED_CASES);\nconst SEED_AUTO = Object.assign(autoBuckets(SEED_CASES), SEED_L1);\nconst SEED_CONFIRMED = seedConfirmed(SEED_CASES);\n\nconst PROC_STAGES = [\n  { label:'File received', note:'Document accepted' },\n  { label:'Document validation', note:'Structure and encoding' },\n  { label:'Text extraction', note:'Page-level OCR pass' },\n  { label:'Article identification', note:'Segmenting source items' },\n  { label:'Story grouping', note:'Clustering related articles' },\n  { label:'Risk / category preparation', note:'Taxonomy assignment' },\n  { label:'Review preparation', note:'Building reviewer workspace' }\n];\n\nconst BUCKETS = [\n  { key:'RELEVANT', title:'Relevant', short:'Relevant', note:'Auto-sorted here · confirm or move each article',\n    emptyNote:'No articles marked relevant.', tint:'#f6faff', border:'#cfe0f5', chipBg:'#eaf3ff', chipFg:'#0e4396', solid:'#1f6feb' },\n  { key:'MANUAL_REVIEW', title:'Manual review', short:'Manual review', note:'Must be emptied — resolve each into relevant or not relevant before submitting',\n    emptyNote:'Nothing held for manual review.', tint:'#fffaf2', border:'#f0e0c6', chipBg:'#fff4e2', chipFg:'#8a5300', solid:'#b46c00' },\n  { key:'NOT_RELEVANT', title:'Not relevant', short:'Not relevant', note:'Discounted — false positives and non-material coverage',\n    emptyNote:'No articles discounted.', tint:'#f8faf9', border:'#dbe6df', chipBg:'#eef7f1', chipFg:'#2b6b47', solid:'#2b6b47' }\n];\n\nconst ARTICLE_REASONS = {\n  RELEVANT: ['Direct involvement of the subject','Regulatory or enforcement action','Credible primary source','Material to the risk rating'],\n  NOT_RELEVANT: ['Different individual or entity','No adverse content','Duplicate of retained coverage','Immaterial to the risk rating'],\n  MANUAL_REVIEW: ['Conflicting sources','Subject identity unconfirmed','Materiality unclear','Awaiting corroboration']\n};\n\nfunction seedArticleReasons(map) {\n  const out = {};\n  Object.keys(map).forEach(k => { const list = ARTICLE_REASONS[map[k]]; if (list) out[k] = list[0]; });\n  return out;\n}\n\nconst REASONS_L1 = ['Adverse media substantiated','Partially substantiated','Source reliability concerns','False positive — name match only','Insufficient information'];\nconst REASONS_L2 = ['Concur with L1 assessment','Risk rating adjusted','Additional sources required','Overturned — insufficient evidence'];\nconst REASONS_BY_DECISION = {\n  'Confirm risk': ['Risk rating confirmed at current level','Risk rating increased on retained coverage','Risk rating reduced but exposure remains','Sustained adverse media across multiple sources','Enforcement or regulatory action substantiated'],\n  'Close — no action': ['No adverse media substantiated','All coverage discounted as false positive','Coverage immaterial to the relationship','Matter historic and resolved','Subject identity not confirmed']\n};\n\nclass Component extends DCLogic {\n  state = {\n    route:'login',\n    l2Done:null,\n    user:null,\n    loginEmail:'', loginPassword:'', loginStep:'id', showPassword:false, loginError:false, passwordError:false, pendingIdent:null,\n    cases: SEED_CASES.map(c => Object.assign({}, c)),\n    activity: SEED_ACTIVITY.slice(),\n    decisionsByArticle: Object.assign({}, SEED_AUTO),\n    confirmed: Object.assign({}, SEED_CONFIRMED),\n    articleReason: seedArticleReasons(SEED_L1),\n    selectedId: null,\n    tab:'me', query:'', filtersOpen:false,\n    filters: { status:[], risk:[], category:[], assignment:'any', l2:'any', dateFrom:'', dateTo:'' },\n    pending: { status:[], risk:[], category:[], assignment:'any', l2:'any', dateFrom:'', dateTo:'' },\n    draft: { file:null, fileError:false, entityName:'', entityType:'ORGANISATION', clientId:'', source:'', knownClient:'', categories:[], l2Required:false },\n    progress:0, procCaseId:null,\n    openStories:{},\n    subDecision:'', subReason:'', subComment:'', subError:'',\n    denied:''\n  };\n\n  componentWillUnmount() { clearInterval(this._timer); }\n\n  // ---------- identity ----------\n  lookupId(email) { return USERS.filter(u => LOGIN_IDS.indexOf(u.id) >= 0).find(u => u.email.toLowerCase() === String(email).trim().toLowerCase()); }\n\n  checkId(email) {\n    const u = this.lookupId(email);\n    if (!u) { this.setState({ loginError:true }); return; }\n    this.setState({ loginEmail:u.email, loginError:false, pendingIdent:u, loginStep:'password', loginPassword:'', passwordError:false });\n  }\n\n  signIn() {\n    const u = this.lookupId(this.state.loginEmail);\n    if (!u) { this.setState({ loginStep:'id', loginError:true }); return; }\n    if (!String(this.state.loginPassword).trim()) { this.setState({ passwordError:true }); return; }\n    this.setState({ user:u, route:'dashboard', loginStep:'id', loginPassword:'', pendingIdent:null, tab:'me', denied:'' });\n  }\n\n  logout() {\n    clearInterval(this._timer);\n    this.setState({ route:'login', user:null, loginEmail:'', loginPassword:'', loginStep:'id', pendingIdent:null, loginError:false, passwordError:false, selectedId:null, denied:'', progress:0 });\n  }\n\n  // ---------- permissions ----------\n  role() { return this.state.user ? this.state.user.role : null; }\n  isAdmin() { return this.role() === 'ADMINISTRATOR'; }\n  isL1() { return this.role() === 'L1_REVIEWER'; }\n  isL2() { return this.role() === 'L2_REVIEWER'; }\n  canCreate() { return this.isL1(); }\n\n  canActL1(c) { return !!c && this.isL1() && c.assignedL1Reviewer === this.state.user.id && c.status === 'L1_REVIEW'; }\n  canActL2(c) { return !!c && this.isL2() && c.assignedL2Reviewer === this.state.user.id && c.status === 'L2_REVIEW' && c.l2ReviewRequired; }\n  canSignOff(c) { return !!c && this.isAdmin() && c.status === 'AWAITING_SIGN_OFF'; }\n\n  myQueueCases() {\n    const s = this.state, me = s.user ? s.user.id : null;\n    if (this.isL1()) return s.cases.filter(c => c.assignedL1Reviewer === me && (c.status === 'L1_REVIEW' || c.status === 'AWAITING_SIGN_OFF' && false));\n    if (this.isL2()) return s.cases.filter(c => c.assignedL2Reviewer === me && c.status === 'L2_REVIEW' && c.l2ReviewRequired);\n    if (this.isAdmin()) return s.cases.filter(c => c.status === 'AWAITING_SIGN_OFF');\n    return [];\n  }\n\n  assignedToMe(c) {\n    const me = this.state.user ? this.state.user.id : null;\n    if (this.isL1()) return c.assignedL1Reviewer === me;\n    if (this.isL2()) return c.assignedL2Reviewer === me;\n    return false;\n  }\n\n  go(route) {\n    if (route === 'config' && !this.isAdmin()) { this.setState({ route:'denied', denied:'You don\\u2019t have permission to open Config. Configuration is restricted to administrators.' }); return; }\n    if (route === 'new' && !this.canCreate()) { this.setState({ route:'denied', denied:'You don\\u2019t have permission to create investigations. Only L1 reviewers open new investigations.' }); return; }\n    this.setState({ route: route, denied:'' });\n  }\n\n  openCase(id) {\n    const c = this.state.cases.find(x => x.id === id);\n    if (c && this.isL1() && (c.status === 'L2_REVIEW' || c.l2ReviewStatus === 'PENDING')) {\n      this.setState({ route:'denied', denied:'This investigation has moved to L2 review. Secondary review pages are restricted to the assigned L2 reviewer — you can see its status in the Inbox, but the case is no longer open to you.' });\n      return;\n    }\n    this.setState({ selectedId:id, route:'review', subDecision:'', subReason:'', subComment:'', subError:'', openStories:{} });\n  }\n\n  logActivity(text, caseId, kind) {\n    const who = this.state.user ? this.state.user.name : 'System';\n    const stamp = '16 Sep 2026 ' + new Date().toTimeString().slice(0,5);\n    this.setState(s => ({ activity: [{ text:text, meta: who + ' · ' + caseId, date: stamp, kind: kind || 'info', caseId: caseId }].concat(s.activity) }));\n  }\n\n  patchCase(id
