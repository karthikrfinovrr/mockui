document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg); , U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"6000eb16-5fc7-46b5-acce-b25e47465268\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"d5b527c5-b5ca-486f-bab9-808353b18960\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"1053b0fb-3162-4aa7-9ad5-2f4c5e0fb7ea\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"480fec76-9b10-4495-b122-9c2dfc94791a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"6000eb16-5fc7-46b5-acce-b25e47465268\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --color-bg: #f4f7fb;\n    --color-surface: #ffffff;\n    --color-text: #0b2545;\n    --color-accent: #1f6feb;\n    --color-divider: #dde7f3;\n    --navy: #0b2545;\n    --navy-2: #123258;\n    --ink-600: #5b7391;\n    --ink-500: #8098b4;\n    --font-heading: \"Plus Jakarta Sans\", system-ui, sans-serif;\n    --font-body: \"Plus Jakarta Sans\", system-ui, sans-serif;\n    --shadow-sm: 0 1px 2px rgba(11,37,69,.06), 0 1px 3px rgba(11,37,69,.05);\n    --shadow-md: 0 6px 18px rgba(11,37,69,.08);\n    --ease: cubic-bezier(.32,.72,0,1);\n  }\n  body { margin:0; background:var(--color-bg); -webkit-font-smoothing:antialiased; }\n  h1,h2,h3,h4 { letter-spacing:-.02em; }\n  a { color:#1257c4; text-decoration:none; }\n  a:hover { color:var(--color-accent); }\n  button, input, select, textarea { font-family:var(--font-body); }\n  button { transition: background-color .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease), transform .18s var(--ease); }\n  .fv-in { animation: fvIn .26s var(--ease) both; }\n  .fv-tick { animation: fvTick .42s var(--ease) both; }\n  @keyframes fvTick {\n    0%   { opacity:0; transform:scale(.6) translateX(-4px) }\n    55%  { opacity:1; transform:scale(1.14) translateX(0) }\n    100% { opacity:1; transform:scale(1) }\n  }\n  @keyframes fvIn { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }\n  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important } }\n  .fv-scroll::-webkit-scrollbar { width:10px; height:10px }\n  .fv-scroll::-webkit-scrollbar-thumb { background:#c9d8ea; border-radius:999px; border:3px solid var(--color-bg) }\n  .fv-scroll::-webkit-scrollbar-track { background:transparent }\n  .fv-inp { width:100%; box-sizing:border-box; font-size:14px; color:var(--color-text); background:#fff; border:1px solid var(--color-divider); border-radius:8px; padding:10px 12px; outline:none; transition: border-color .15s ease, box-shadow .15s ease }\n  .fv-inp:focus { border-color:var(--color-accent); box-shadow:0 0 0 3px rgba(31,111,235,.14) }\n  .fv-lbl { display:block; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-600); margin-bottom:6px }\n  .fv-row:hover { background:#f7fafd }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;font-family:var(--font-body);color:var(--color-text);background:#fff\">\n  <div style=\"background:linear-gradient(180deg,#0b2545 0%,#123258 100%);color:#fff;padding:56px 60px;display:flex;flex-direction:column;justify-content:space-between\">\n    <div style=\"display:flex;align-items:center;gap:12px\">\n      <div style=\"width:34px;height:34px;border-radius:9px;background:var(--color-accent);display:grid;place-items:center;font-family:var(--font-heading);font-weight:800;font-size:15px\">F<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-weight:800;font-size:19px;letter-spacing:.02em\">FINOVRR<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:420px\">\n      <div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:16px\">Adverse media investigation platform<\u002Fdiv>\n      <h1 style=\"font-size:40px;line-height:1.1;margin:0 0 18px;font-family:var(--font-heading);font-weight:800\">Evidence-led screening, reviewed by the right people.<\u002Fh1>\n      <p style=\"font-size:15px;line-height:1.6;color:rgba(255,255,255,.72);margin:0\">Upload, process, review at L1, escalate to L2 where secondary review is required, then sign off — one auditable trail from document to decision.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;color:rgba(255,255,255,.5)\">Access and permissions are derived from your organisation identity.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;place-items:center;padding:48px 40px\">\n    <div style=\"width:100%;max-width:392px\">\n      <h2 style=\"font-size:27px;margin:0 0 6px;font-family:var(--font-heading);font-weight:800\">Sign in<\u002Fh2>\n\n      <sc-if value=\"{{ atIdStep }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <p style=\"font-size:13px;color:var(--ink-600);margin:0 0 26px;line-height:1.55\">Step 1 of 2 — enter your organisation ID. We verify it against your directory before asking for a password.<\u002Fp>\n          <div style=\"margin-bottom:14px\">\n            <label class=\"fv-lbl\">ID<\u002Flabel>\n            <input class=\"fv-inp\" type=\"email\" placeholder=\"name@finovrr.com\" value=\"{{ loginEmail }}\" sc-camel-on-change=\"{{ onLoginEmail }}\" sc-camel-on-key-down=\"{{ onIdKeyDown }}\">\n          <\u002Fdiv>\n          <sc-if value=\"{{ loginError }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border-left:3px solid #c62828;background:#fdecec;padding:9px 12px;font-size:12px;color:#8c1d1d;border-radius:0 6px 6px 0;margin-bottom:14px\">That ID is not in your organisation directory.<\u002Fdiv>\n          <\u002Fsc-if>\n          <button style=\"width:100%;border:0;cursor:pointer;background:var(--color-accent);color:#fff;font-family:var(--font-heading);font-weight:800;font-size:14px;border-radius:9px;padding:13px 16px;box-shadow:0 2px 8px rgba(31,111,235,.28)\" style-hover=\"background:#3d8bf5\" sc-camel-on-click=\"{{ onCheckId }}\">Continue<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ atPasswordStep }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <p style=\"font-size:13px;color:var(--ink-600);margin:0 0 22px;line-height:1.55\">Step 2 of 2 — ID verified. Enter your password to sign in.<\u002Fp>\n          <div style=\"display:flex;align-items:center;gap:12px;border:1px solid var(--color-divider);border-radius:10px;box-shadow:var(--shadow-sm);padding:11px 13px;margin-bottom:18px\">\n            <div style=\"width:30px;height:30px;flex:none;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--font-heading);font-weight:800;font-size:11px\">{{ pendingInitials }}<\u002Fdiv>\n            <div style=\"min-width:0;flex:1\">\n              <div style=\"font-size:13px;font-family:var(--font-heading);font-weight:800\">{{ pendingName }}<\u002Fdiv>\n              <div style=\"font-size:11px;color:var(--ink-600)\">{{ loginEmail }}<\u002Fdiv>\n            <\u002Fdiv>\n            <button style=\"flex:none;background:none;border:none;padding:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#1257c4;cursor:pointer\" sc-camel-on-click=\"{{ onBackToId }}\">Change<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"margin-bottom:14px\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n              <label class=\"fv-lbl\">Password<\u002Flabel>\n              <button style=\"background:none;border:none;padding:0 0 6px;font-size:12px;font-weight:700;color:#1257c4;cursor:pointer\" sc-camel-on-click=\"{{ onTogglePassword }}\">{{ passwordToggleLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n            <input class=\"fv-inp\" type=\"{{ passwordInputType }}\" placeholder=\"••••••••\" value=\"{{ loginPassword }}\" sc-camel-on-change=\"{{ onLoginPassword }}\" sc-camel-on-key-down=\"{{ onPasswordKeyDown }}\">\n          <\u002Fdiv>\n          <sc-if value=\"{{ passwordError }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border-left:3px solid #c62828;background:#fdecec;padding:9px 12px;font-size:12px;color:#8c1d1d;border-radius:0 6px 6px 0;margin-bottom:14px\">Enter a password to continue. Any value is accepted in this prototype.<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;gap:10px\">\n            <button style=\"flex:none;cursor:pointer;background:#fff;border:1px solid var(--color-divider);color:var(--color-text);font-family:var(--font-heading);font-weight:800;font-size:14px;border-radius:9px;padding:13px 18px\" style-hover=\"background:#eef4fd\" sc-camel-on-click=\"{{ onBackToId }}\">Back<\u002Fbutton>\n            <button style=\"flex:1;border:0;cursor:pointer;background:var(--color-accent);color:#fff;font-family:var(--font-heading);font-weight:800;font-size:14px;border-radius:9px;padding:13px 16px;box-shadow:0 2px 8px rgba(31,111,235,.28)\" style-hover=\"background:#3d8bf5\" sc-camel-on-click=\"{{ onSignIn }}\">Sign in<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showDemo }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:30px;border-top:1px solid var(--color-divider);padding-top:18px\">\n        <div style=\"font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-500);margin-bottom:10px\">Prototype identities — development only<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ directory }}\" as=\"d\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ d.onPick }}\" style=\"display:flex;align-items:center;gap:11px;text-align:left;cursor:pointer;background:#fff;border:1px solid var(--color-divider);border-radius:10px;padding:10px 12px\" style-hover=\"border-color:#a9cdff;background:#f6faff\">\n              <div style=\"width:28px;height:28px;flex:none;border-radius:8px;background:#eaf3ff;color:#0e4396;display:grid;place-items:center;font-family:var(--font-heading);font-weight:800;font-size:11px\">{{ d.initials }}<\u002Fdiv>\n              <div style=\"min-width:0;flex:1\">\n                <div style=\"font-size:13px;font-family:var(--font-heading);font-weight:800\">{{ d.name }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:var(--ink-600)\">{{ d.roleLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-size:11px;color:var(--ink-500);margin-top:12px;line-height:1.5\">Selecting an identity fills the ID and moves to the password step. Roles are never chosen at sign-in — they come from the identity.<\u002Fp>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isApp }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"height:100vh;overflow:hidden;display:flex;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text)\">\n\n  <aside style=\"width:268px;flex:none;background:linear-gradient(180deg,#0b2545 0%,#0e2b50 100%);color:#fff;display:flex;flex-direction:column\">\n    <div style=\"padding:20px 18px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.09)\">\n      <div style=\"width:30px;height:30px;border-radius:8px;background:var(--color-accent);display:grid;place-items:center;font-family:var(--font-heading);font-weight:800;font-size:14px\">F<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-weight:800;font-size:16px;letter-spacing:.03em\">FINOVRR<\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ canCreate }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"padding:16px 14px 6px\">\n      <button sc-camel-on-click=\"{{ onNew }}\" style=\"width:100%;display:flex;align-items:center;justify-content:center;gap:9px;border:0;cursor:pointer;background:var(--color-accent);color:#fff;font-family:var(--font-heading);font-weight:800;font-size:14px;border-radius:10px;padding:13px 14px;box-shadow:0 4px 14px rgba(31,111,235,.35)\" style-hover=\"background:#3d8bf5;transform:translateY(-1px)\">\n        <span style=\"font-size:17px;line-height:1\">+<\u002Fspan><span>New Investigation<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <nav style=\"padding:14px 14px 8px;display:flex;flex-direction:column;gap:7px\">\n      <div style=\"font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.42);padding:6px 4px 6px\">Workspace<\u002Fdiv>\n      <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"2\">\n        <button sc-camel-on-click=\"{{ item.onClick }}\" style=\"display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;border:1px solid {{ item.border }};border-radius:11px;padding:13px 13px;font-family:var(--font-heading);font-weight:800;font-size:15px;background:{{ item.bg }};color:{{ item.fg }};box-shadow:{{ item.shadow }}\" style-hover=\"background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.26)\">\n          <span style=\"width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:12px;letter-spacing:.03em;background:{{ item.tileBg }};color:{{ item.tileFg }}\">{{ item.glyph }}<\u002Fspan>\n          <span style=\"flex:1;min-width:0\">{{ item.label }}<\u002Fspan>\n          <sc-if value=\"{{ item.count }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px;background:rgba(255,255,255,.16)\">{{ item.count }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n\n    <div style=\"flex:1\"><\u002Fdiv>\n    <div style=\"padding:16px 16px 18px;border-top:1px solid rgba(255,255,255,.09)\">\n      <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:12px\">\n        <div style=\"width:34px;height:34px;flex:none;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-family:var(--font-heading);font-weight:800;font-size:12px\">{{ userInitials }}<\u002Fdiv>\n        <div style=\"min-width:0\">\n          <div style=\"font-size:13px;font-family:var(--font-heading);font-weight:800\">{{ userName }}<\u002Fdiv>\n          <div style=\"font-size:11px;color:rgba(255,255,255,.6)\">{{ userRoleLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ onLogout }}\" style=\"width:100%;cursor:pointer;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.86);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:9px;padding:10px\" style-hover=\"background:rgba(255,255,255,.14)\">Sign out<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main class=\"fv-scroll\" style=\"flex:1;min-width:0;min-height:0;overflow:auto\">\n    <header style=\"position:sticky;top:0;z-index:20;background:rgba(244,247,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--color-divider);padding:16px 28px;display:flex;align-items:center;gap:18px\">\n      <div style=\"min-width:0;flex:1\">\n        <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500)\">{{ crumb }}<\u002Fdiv>\n        <h1 style=\"margin:2px 0 0;font-family:var(--font-heading);font-weight:800;font-size:22px\">{{ pageTitle }}<\u002Fh1>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--ink-600);text-align:right\">\n        <div style=\"font-weight:700;color:var(--color-text)\">{{ userName }}<\u002Fdiv>\n        <div>{{ userRoleLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div style=\"padding:24px 28px 44px\">\n\n      <sc-if value=\"{{ isDenied }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"fv-in\" style=\"max-width:560px;margin:56px auto;background:#fff;border:1px solid var(--color-divider);border-radius:14px;box-shadow:var(--shadow-md);padding:34px;text-align:center\">\n        <div style=\"width:46px;height:46px;margin:0 auto 16px;border-radius:12px;background:#fdecec;color:#8c1d1d;display:grid;place-items:center;font-family:var(--font-heading);font-weight:800;font-size:20px\">!<\u002Fdiv>\n        <h2 style=\"margin:0 0 8px;font-size:21px;font-family:var(--font-heading);font-weight:800\">Access denied<\u002Fh2>\n        <p style=\"margin:0 0 22px;font-size:14px;line-height:1.6;color:var(--ink-600)\">{{ deniedMessage }}<\u002Fp>\n        <button sc-camel-on-click=\"{{ onGoDashboard }}\" style=\"border:0;cursor:pointer;background:var(--color-accent);color:#fff;font-family:var(--font-heading);font-weight:800;font-size:14px;border-radius:9px;padding:12px 22px\" style-hover=\"background:#3d8bf5\">Return to Dashboard<\u002Fbutton>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isDashboard }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"fv-in\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px\">\n          <sc-for list=\"{{ tiles }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <div style=\"background:#fff;border:1px solid var(--color-divider);border-radius:12px;box-shadow:var(--shadow-sm);padding:16px 17px\">\n              <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-600);margin-bottom:10px\">{{ t.label }}<\u002Fdiv>\n              <div style=\"display:flex;align-items:baseline;gap:8px\">\n                <div style=\"font-family:var(--font-heading);font-weight:800;font-size:31px;line-height:1;color:{{ t.color }}\">{{ t.value }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--ink-600)\">{{ t.unit }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:12px;color:var(--ink-600);margin-top:9px;line-height:1.45\">{{ t.note }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"background:{{ l2Card.bg }};border:1px solid {{ l2Card.border }};border-radius:12px;padding:18px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin-bottom:22px\">\n          <div style=\"min-width:220px;flex:1\">\n            <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:{{ l2Card.kicker }};font-weight:700;margin-bottom:6px\">L2 review required<\u002Fdiv>\n            <div style=\"font-family:var(--font-heading);font-weight:800;font-size:19px;margin-bottom:4px\">{{ l2Card.headline }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:var(--ink-600)\">{{ l2Card.sub }}<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ l2Card.onCta }}\" style=\"border:1px solid {{ l2Card.ctaBorder }};cursor:pointer;background:{{ l2Card.ctaBg }};color:{{ l2Card.ctaFg }};font-family:var(--font-heading);font-weight:800;font-size:13px;border-radius:9px;padding:12px 18px\" style-hover=\"filter:brightness(1.06)\">{{ l2Card.cta }}<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start\">\n          <div style=\"min-width:0;display:flex;flex-direction:column;gap:18px\">\n            <div style=\"background:#fff;border:1px solid var(--color-divider);border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden\">\n              <div style=\"padding:15px 18px;border-bottom:1px solid var(--color-divider);display:flex;align-items:center;gap:12px\">\n                <h3 style=\"margin:0;font-size:15px;font-family:var(--font-heading);font-weight:800;flex:1\">My work queue<\u002Fh3>\n                <span style=\"font-size:12px;color:var(--ink-600)\">{{ queueNote }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ hasQueue }}\" hint-placeholder-val=\"{{ true }}\">\n              <div>\n                <sc-for list=\"{{ myQueue }}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <div class=\"fv-row\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid #eef3f9\">\n                    <div style=\"min-width:200px;flex:1\">\n                      <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:4px\">\n                        <span style=\"font-family:var(--font-heading);font-weight:800;font-size:13px\">{{ c.id }}<\u002Fspan>\n                        <span style=\"font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:{{ c.statusBg }};color:{{ c.statusFg }}\">{{ c.statusLabel }}<\u002Fspan>\n                        <span style=\"font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:{{ c.riskBg }};color:{{ c.riskFg }}\">{{ c.riskLabel }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"font-size:14px;font-weight:600\">{{ c.entityName }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:var(--ink-600);margin-top:3px\">{{ c.metaLine }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ c.onOpen }}\" style=\"flex:none;cursor:pointer;border:1px solid {{ c.actBorder }};background:{{ c.actBg }};color:{{ c.actFg }};font-family:var(--font-heading);font-weight:800;font-size:13px;border-radius:9px;padding:10px 16px\" style-hover=\"filter:brightness(1.05)\">{{ c.actLabel }}<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ queueEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:30px 18px;text-align:center;font-size:13px;color:var(--ink-600)\">Nothing is actionable by you right now.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid var(--color-divider);border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden\">\n              <div style=\"padding:15px 18px;border-bottom:1px solid var(--color-divider);display:flex;align-items:center;gap:12px\">\n                <h3 style=\"margin:0;font-size:15px;font-family:var(--font-heading);font-weight:800;flex:1\">Recently created<\u002Fh3>\n                <span style=\"font-size:12px;color:var(--ink-600)\">Assignment shown — not necessarily your work<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ recent }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <div class=\"fv-row\" style=\"display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid #eef3f9;cursor:pointer\" sc-camel-on-click=\"{{ c.onOpen }}\">\n                  <div style=\"min-width:0;flex:1\">\n                    <div style=\"font-size:13px;font-family:var(--font-heading);font-weight:800\">{{ c.id }} · {{ c.entityName }}<\u002Fdiv>\n                    <div style=\"font-size:12px;color:var(--ink-600);margin-top:3px\">{{ c.assignLine }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"flex:none;font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;background:{{ c.statusBg }};color:{{ c.statusFg }}\">{{ c.statusLabel }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"min-width:0;background:#fff;border:1px solid var(--color-divider);border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden\">\n            <div style=\"padding:15px 18px;border-bottom:1px solid var(--color-divider)\">\n              <h3 style=\"margin:0;font-size:15px;font-family:var(--font-heading);font-weight:800\">Recent activity<\u002Fh3>\n            <\u002Fdiv>\n            <div style=\"padding:6px 18px 16px\">\n              <sc-for list=\"{{ activityFeed }}\" as=\"a\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #f1f5fa\">\n                  <div style=\"width:8px;height:8px;flex:none;border-radius:999px;margin-top:6px;background:{{ a.dot }}\"><\u002Fdiv>\n                  <div style=\"min-width:0\">\n                    <div style=\"font-size:13px;font-weight:600\">{{ a.text }}<\u002Fdiv>\n                    <div style=\"font-size:11px;color:var(--ink-600);margin-top:2px\">{{ a.meta }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isInbox }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"fv-in\">\n        <div style=\"background:#fff;border:1px solid var(--color-divider);border-radius:12px;box-shadow:var(--shadow-sm);padding:14px 16px;margin-bottom:16px\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n            <input class=\"fv-inp\" style=\"flex:1;min-width:260px\" placeholder=\"Search investigations, entities or Case ID...\" value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\">\n            <button sc-camel-on-click=\"{{ onToggleFilters }}\" style=\"flex:none;cursor:pointer;border:1px solid {{ filterBtn.border }};background:{{ filterBtn.bg }};color:{{ filterBtn.fg }};font-family:var(--font-heading);font-weight:800;font-size:13px;border-radius:9px;padding:11px 16px\" style-hover=\"border-color:#a9cdff\">{{ filterBtn.label }}<\u002Fbutton>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ filtersOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;border-top:1px solid var(--color-divider);padding-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:18px\">\n            <div>\n              <div class=\"fv-lbl\">Status<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n                <sc-for list=\"{{ statusOptions }}\" as=\"o\" hint-placeholder-count=\"6\">\n                  <button sc-camel-on-click=\"{{ o.onToggle }}\" style=\"cursor:pointer;font-size:12px;font-weight:700;border-radius:999px;padding:6px 12px;border:1px solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div class=\"fv-lbl\">Risk<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n                <sc-for list=\"{{ riskOptions }}\" as=\"o\" hint-placeholder-count=\"4\">\n                  <button sc-camel-on-click=\"{{ o.onToggle }}\" style=\"cursor:pointer;font-size:12px;font-weight:700;border-radius:999px;padding:6px 12px;border:1px solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div class=\"fv-lbl\">Category<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n                <sc-for list=\"{{ categoryOptions }}\" as=\"o\" hint-placeholder-count=\"6\">\n                  <button sc-camel-on-click=\"{{ o.onToggle }}\" style=\"cursor:pointer;font-size:12px;font-weight:700;border-radius:999px;padding:6px 12px;border:1px solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div class=\"fv-lbl\">Assignment<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n                <sc-for list=\"{{ assignOptions }}\" as=\"o\" hint-placeholder-count=\"4\">\n                  <button sc-camel-on-click=\"{{ o.onToggle }}\" style=\"cursor:pointer;font-size:12px;font-weight:700;border-radius:999px;padding:6px 12px;border:1px solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div class=\"fv-lbl\">L2<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n                <sc-for list=\"{{ l2Options }}\" as=\"o\" hint-placeholder-count=\"5\">\n                  <button sc-camel-on-click=\"{{ o.onToggle }}\" style=\"cursor:pointer;font-size:12px;font-weight:700;border-radius:999px;padding:6px 12px;border:1px solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div class=\"fv-lbl\">Created from<\u002Fdiv>\n              <input class=\"fv-inp\" type=\"date\" value=\"{{ dateFrom }}\" sc-camel-on-change=\"{{ onDateFrom }}\">\n              <div class=\"fv-lbl\" style=\"margin-top:12px\">Created to<\u002Fdiv>\n              <input class=\"fv-inp\" type=\"date\" value=\"{{ dateTo }}\" sc-camel-on-change=\"{{ onDateTo }}\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:flex-end;gap:10px;margin-top:16px;border-top:1px solid var(--color-divider);padding-top:14px\">\n            <button sc-camel-on-click=\"{{ onClearFilters }}\" style=\"cursor:pointer;background:#fff;border:1px solid var(--color-divider);color:var(--color-text);font-family:var(--font-heading);font-weight:800;font-size:13px;border-radius:9px;padding:10px 16px\" style-hover=\"background:#eef4fd\">Clear filters<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ onApplyFilters }}\" style=\"cursor:pointer;border:0;background:var(--color-accent);color:#fff;font-family:var(--font-heading);font-weight:800;font-size:13px;border-radius:9px;padding:10px 18px\" style-hover=\"background:#3d8bf5\">Apply filters<\u002Fbutton>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px\">\n          <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:9px;border:1px solid {{ t.border }};background:{{ t.bg }};color:{{ t.fg }};font-family:var(--font-heading);font-weight:800;font-size:13px;border-radius:10px;padding:10px 15px\" style-hover=\"border-color:#a9cdff\">\n              <span>{{ t.label }}<\u002Fspan>\n              <span style=\"font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:{{ t.countBg }};color:{{ t.countFg }}\">{{ t.count }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <sc-for list=\"{{ results }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"background:#fff;border:1px solid var(--color-divider);border-radius:12px;box-shadow:var(--shadow-sm);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto;gap:20px;align-items:start\">\n              <div style=\"min-width:0\">\n                <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:7px\">\n                  <span style=\"font-family:var(--font-heading);font-weight:800;font-size:14px\">{{ c.id }}<\u002Fspan>\n                  <span style=\"font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:{{ c.statusBg }};color:{{ c.statusFg }}\">{{ c.statusLabel }}<\u002Fspan>\n                  <span style=\"font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:{{ c.riskBg }};color:{{ c.riskFg }}\">Risk: {{ c.riskLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:16px;font-family:var(--font-heading);font-weight:800\">{{ c.entityName }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--ink-600);margin-top:2px\">{{ c.entityTypeLabel }} · {{ c.articleCount }} articles · {{ c.storyCount }} stories<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:10px\">\n                  <sc-for list=\"{{ c.categories }}\" as=\"cat\" hint-placeholder-count=\"2\">\n                    <span style=\"font-size:11px;font-weight:600;border-radius:6px;padding:3px 9px;background:#f1f6fc;border:1px solid #e2ebf6;color:#3c5a7e\">{{ cat.name }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"min-width:0;font-size:12px;color:var(--ink-600);display:flex;flex-direction:column;gap:5px\">\n                <div><span style=\"color:var(--ink-500)\">L1 reviewer:<\u002Fspan> <strong style=\"color:var(--color-text)\">{{ c.l1Name }}<\u002Fstrong><\u002Fdiv>\n                <div><span style=\"color:var(--ink-500)\">L1 status:<\u002Fspan> {{ c.l1StatusLabel }}<\u002Fdiv>\n                <div><span style=\"color:var(--ink-500)\">L2 required:<\u002Fspan> {{ c.l2RequiredLabel }}<\u002Fdiv>\n                <div><span style=\"color:var(--ink-500)\">L2 reviewer:<\u002Fspan> <strong style=\"color:var(--color-text)\">{{ c.l2Name }}<\u002Fstrong><\u002Fdiv>\n                <div><span style=\"color:var(--ink-500)\">L2 status:<\u002Fspan> {{ c.l2StatusLabel }}<\u002Fdiv>\n                <div><span style=\"color:var(--ink-500)\">Updated:<\u002Fspan> {{ c.updatedLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px;align-items:stretch\">\n                <button sc-camel-on-click=\"{{ c.onOpen }}\" style=\"cursor:pointer;border:1px solid {{ c.actBorder }};background:{{ c.actBg }};color:{{ c.actFg }};font-family:var(--font-heading);font-weight:800;font-size:13px;border-radius:9px;padding:10px 16px;white-space:nowrap\" style-hover=\"filter:brightness(1.05)\">{{ c.actLabel }}<\u002Fbutton>\n                <div style=\"font-size:11px;color:var(--ink-500);max-width:180px;line-height:1.4\">{{ c.actNote }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px dashed var(--color-divider);border-radius:12px;padding:40px;text-align:center;font-size:13px;color:var(--ink-600)\">No investigations match the current search and filters.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isConfig }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"fv-in\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start\">\n        <div style=\"background:#fff;border:1px solid var(--color-divider);border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden\">\n          <div style=\"padding:15px 18px;border-bottom:1px solid var(--color-divider)\">\n            <h3 style=\"margin:0;font-size:15px;font-family:var(--font-heading);font-weight:800\">Users &amp; roles<\u002Fh3>\n            <div style=\"font-size:12px;color:var(--ink-600);margin-top:3px\">Roles are provisioned by the identity provider.<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ configUsers }}\" as=\"u\" hint-placeholder-count=\"4\">\n            <div class=\"fv-row\" style=\"display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid #eef3f9\">\n              <div style=\"width:32px;height:32px;flex:none;border-radius:9px;background:#eaf3ff;color:#0e4396;display:grid;place-items:center;font-family:var(--font-heading);font-weight:800;font-size:11px\">{{ u.initials }}<\u002Fdiv>\n              <div style=\"min-width:0;flex:1\">\n                <div style=\"font-size:13px;font-family:var(--font-heading);font-weight:800\">{{ u.name }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:var(--ink-600)\">{{ u.email }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"flex:none;font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;background:#f1f6fc;border:1px solid #e2ebf6;color:#3c5a7e\">{{ u.roleLabel }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid var(--color-divider);border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden\">\n          <div style=\"padding:15px 18px;border-bottom:1px solid var(--color-divider)\">\n            <h3 style=\"margin:0;font-size:15px;font-family:var(--font-heading);font-weight:800\">Risk categories<\u002Fh3>\n            <div style=\"font-size:12px;color:var(--ink-600);margin-top:3px\">Taxonomy applied to stories and articles.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:16px 18px;display:flex;flex-wrap:wrap;gap:8px\">\n            <sc-for list=\"{{ configCategories }}\" as=\"cat\" hint-placeholder-count=\"6\">\n              <span style=\"font-size:12px;font-weight:600;border-radius:7px;padding:6px 11px;background:#f1f6fc;border:1px solid #e2ebf6;color:#3c5a7e\">{{ cat.name }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid var(--color-divider);border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden\">\n          <div style=\"padding:15px 18px;border-bottom:1px solid var(--color-divider)\">\n            <h3 style=\"margin:0;font-size:15px;font-family:var(--font-heading);font-weight:800\">Workflow rules<\u002Fh3>\n            <div style=\"font-size:12px;color:var(--ink-600);margin-top:3px\">Governs routing between L1, L2 and sign-off.<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ configRules }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"padding:13px 18px;border-bottom:1px solid #eef3f9;display:flex;gap:14px;align-items:center\">\n              <div style=\"min-width:0;flex:1\">\n                <div style=\"font-size:13px;font-weight:700\">{{ r.label }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--ink-600);margin-top:2px\">{{ r.note }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"flex:none;font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;background:{{ r.bg }};color:{{ r.fg }}\">{{ r.value }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isNew }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"fv-in\" style=\"max-width:940px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px\">\n          <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:10px;flex:1;min-width:190px;background:{{ s.bg }};border:1px solid {{ s.border }};border-radius:11px;padding:12px 14px\">\n              <div style=\"width:26px;height:26px;flex:none;border-radius:999px;display:grid;place-items:center;font-family:var(--font-heading);font-weight:800;font-size:12px;background:{{ s.numBg }};color:{{ s.numFg }}\">{{ s.num }}<\u002Fdiv>\n              <div style=\"min-width:0\">\n                <div style=\"font-size:13px;font-family:var(--font-heading);font-weight:800;color:{{ s.fg }}\">{{ s.label }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:var(--ink-600)\">{{ s.note }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start\">\n          <div style=\"background:#fff;border:1px solid var(--color-divider);border-radius:12px;box-shadow:var(--shadow-sm);padding:20px\">\n            <h3 style=\"margin:0 0 4px;font-size:15px;font-family:var(--font-heading);font-weight:800\">Upload source document<\u002Fh3>\n            <p style=\"margin:0 0 16px;font-size:12px;color:var(--ink-600)\">PDF only. Nothing leaves this prototype — the file is read locally.<\u002Fp>\n\n            <sc-if value=\"{{ noFile }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"border:1.5px dashed #b9cee6;border-radius:12px;background:#f8fbff;padding:34px 20px;text-align:center\">\n              <div style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;margin-bottom:6px\">Drag &amp; drop PDF<\u002Fdiv>\n              <div style=\"font-size:12px;color:var(--ink-600);margin-bottom:16px\">or select a file from your device<\u002Fdiv>\n              <label style=\"display:inline-block;cursor:pointer;background:var(--color-accent);color:#fff;font-family:var(--font-heading);font-weight:800;font-size:13px;border-radius:9px;padding:11px 18px\">\n                <span>Browse files<\u002Fspan>\n                <input type=\"file\" accept=\"application/pdf\" style=\"display:none\" sc-camel-on-change=\"{{ onPickFile }}\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ hasFile }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border:1px solid var(--color-divider);border-radius:11px;padding:14px;display:flex;align-items:center;gap:13px;background:#f8fbff\">\n              <div style=\"width:38px;height:38px;flex:none;border-radius:9px;background:#0b2545;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.04em\">PDF<\u002Fdiv>\n              <div style=\"min-width:0;flex:1\">\n                <div style=\"font-size:13px;font-family:var(--font-heading);font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ fileName }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:var(--ink-600)\">{{ fileSize }}<\u002Fdiv>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ onRemoveFile }}\" style=\"flex:none;cursor:pointer;background:#fff;border:1px solid var(--color-divider);color:#8c1d1d;font-size:12px;font-weight:700;border-radius:8px;padding:8px 12px\" style-hover=\"background:#fdecec\">Remove<\u002Fbutton>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ fileError }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:12px;border-left:3px solid #c62828;background:#fdecec;padding:9px 12px;font-size:12px;color:#8c1d1d;border-radius:0 6px 6px 0\">That file is not a PDF. Select a PDF document.<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"height:1px;background:var(--color-divider);margin:22px 0\"><\u002Fdiv>\n\n            <h3 style=\"margin:0 0 14px;font-size:15px;font-family:var(--font-heading);font-weight:800\">Case details<\u002Fh3>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px\">\n              <div>\n                <label class=\"fv-lbl\">Entity name<\u002Flabel>\n                <input class=\"fv-inp\" placeholder=\"Registered name of subject\" value=\"{{ entityName }}\" sc-camel-on-change=\"{{ onEntityName }}\">\n              <\u002Fdiv>\n              <div>\n                <label class=\"fv-lbl\">Entity type<\u002Flabel>\n                <div style=\"display:flex;gap:8px\">\n                  <sc-for list=\"{{ entityTypeOptions }}\" as=\"o\" hint-placeholder-count=\"2\">\n                    <button sc-camel-on-click=\"{{ o.onPick }}\" style=\"flex:1;cursor:pointer;font-size:13px;font-weight:700;border-radius:9px;padding:10px;border:1px solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <label class=\"fv-lbl\">Client ID (optional)<\u002Flabel>\n                <input class=\"fv-inp\" placeholder=\"Internal reference\" value=\"{{ clientId }}\" sc-camel-on-change=\"{{ onClientId }}\">\n              <\u002Fdiv>\n              <div>\n                <label class=\"fv-lbl\">Source<\u002Flabel>\n                <input class=\"fv-inp\" placeholder=\"Where the document came from\" value=\"{{ source }}\" sc-camel-on-change=\"{{ onSource }}\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:14px\">\n              <label class=\"fv-lbl\">Known client details<\u002Flabel>\n              <textarea class=\"fv-inp\" rows=\"3\" style=\"resize:vertical\" placeholder=\"Anything already held on this client — relationship, prior investigations, known exposures\" value=\"{{ knownClient }}\" sc-camel-on-change=\"{{ onKnownClient }}\"><\u002Ftextarea>\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid var(--color-divider);border-radius:12px;box-shadow:var(--shadow-sm);padding:20px\">\n            <h3 style=\"margin:0 0 14px;font-size:15px;font-family:var(--font-heading);font-weight:800\">Review routing<\u002Fh3>\n            <label style=\"display:flex;gap:11px;align-items:flex-start;cursor:pointer;border:1px solid {{ l2CheckBorder }};background:{{ l2CheckBg }};border-radius:11px;padding:14px\">\n              <input type=\"checkbox\" checked=\"{{ l2Required }}\" sc-camel-on-change=\"{{ onToggleL2 }}\" style=\"margin-top:2px;width:16px;height:16px;accent-color:#1f6feb\">\n              <span style=\"min-width:0\">\n                <span style=\"display:block;font-size:14px;font-family:var(--font-heading);font-weight:800\">L2 review required<\u002Fspan>\n                <span style=\"display:block;font-size:12px;color:var(--ink-600);margin-top:4px;line-height:1.5\">Select this if the investigation requires secondary review after L1 review.<\u002Fspan>\n              <\u002Fspan>\n            <\u002Flabel>\n            <p style=\"font-size:12px;color:var(--ink-600);line-height:1.55;margin:14px 0 0\">Reviewers are not chosen here. The workflow assigns L1 and, where required, L2 from the authenticated reviewer pool.<\u002Fp>\n\n            <div style=\"height:1px;background:var(--color-divider);margin:20px 0\"><\u002Fdiv>\n\n            <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-600);margin-bottom:10px\">Ready to proceed<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px;margin-bottom:18px\">\n              <sc-for list=\"{{ newChecklist }}\" as=\"k\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;gap:10px;align-items:center;font-size:13px;color:{{ k.fg }}\">\n                  <span style=\"width:18px;height:18px;flex:none;border-radius:999px;display:grid;place-items:center;font-size:10px;font-weight:800;background:{{ k.bg }};color:{{ k.tick }}\">{{ k.mark }}<\u002Fspan>\n                  <span>{{ k.label }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ onProceed }}\" disabled=\"{{ proceedDisabled }}\" style=\"width:100%;cursor:{{ proceedCursor }};border:0;background:{{ proceedBg }};color:{{ proceedFg }};font-family:var(--font-heading);font-weight:800;font-size:14px;border-radius:10px;padding:13px\" style-hover=\"filter:brightness(1.05)\">Proceed to processing<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isProcessing }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"fv-in\" style=\"max-width:940px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px\">\n          <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:10px;flex:1;min-width:190px;background:{{ s.bg }};border:1px solid {{ s.border }};border-radius:11px;padding:12px 14px\">\n              <div style=\"width:26px;height:26px;flex:none;border-radius:999px;display:grid;place-items:center;font-family:var(--font-heading);font-weight:800;font-size:12px;background:{{ s.numBg }};color:{{ s.numFg }}\">{{ s.num }}<\u002Fdiv>\n              <div style=\"min-width:0\">\n                <div style=\"font-size:13px;font-family:var(--font-heading);font-w
